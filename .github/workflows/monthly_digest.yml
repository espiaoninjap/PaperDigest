name: Monthly Paper Digest

on:
  schedule:
    # Runs at 08:00 UTC on the 1st of every month
    - cron: "0 8 1 * *"
  workflow_dispatch:   # lets you trigger it manually from GitHub to test

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No extra packages needed — script uses only stdlib + urllib

      - name: Run paper digest script
        env:
          SENDER_EMAIL:    ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python fetch_papers.py
